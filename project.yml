name: DontBurn

options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  DontBurnCore:
    path: Packages/DontBurnCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 1
    # "Sign to Run Locally": works without an Apple developer account.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # The app's two bundle identifiers, in one place: the app takes one per
    # configuration, and the hook tool carries both in its Info.plist, so it
    # reaches either build whichever configuration built it.
    DONTBURN_RELEASE_BUNDLE_IDENTIFIER: io.github.slavo775.dontburn
    DONTBURN_DEV_BUNDLE_IDENTIFIER: $(DONTBURN_RELEASE_BUNDLE_IDENTIFIER).dev

targets:
  DontBurn:
    type: application
    platform: macOS
    sources:
      - Apps/Mac
    dependencies:
      - package: DontBurnCore
      # The hook tool rides inside the app, so a settings file names it by one
      # fixed absolute path. Contents/Helpers is the place for a bundle's
      # command line tools. The tool still reads the Info.plist built into its
      # own binary, so it finds both builds' channels as before.
      - target: dontburn-hook
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_NAME: DontBurn
        GENERATE_INFOPLIST_FILE: YES
        # Menu bar only, no Dock icon.
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        # The app reads other tools' session files and scripts terminals.
        ENABLE_APP_SANDBOX: NO
        # The compiler reports every interface string the code uses. Without
        # it, a build in the Xcode app sees no strings and deletes every key
        # from Localizable.xcstrings as unused.
        SWIFT_EMIT_LOC_STRINGS: YES
        # The build phase below writes into the built Info.plist, which the
        # script sandbox would refuse.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # The development build has its own identifier, so its data, settings
        # and permissions never mix with the daily copy.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: $(DONTBURN_DEV_BUNDLE_IDENTIFIER)
          APP_DISPLAY_NAME: "Don't Burn Your Brain Dev"
          APP_VARIANT: Dev
          # A tinted placeholder, so Dev is never taken for the daily copy.
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: $(DONTBURN_RELEASE_BUNDLE_IDENTIFIER)
          APP_DISPLAY_NAME: "Don't Burn Your Brain"
          APP_VARIANT: Release
    postBuildScripts:
      # The variant comes from APP_VARIANT. Dev also carries the short commit
      # hash, read at build time; without git it carries none.
      - name: Variant and commit
        basedOnDependencyAnalysis: false
        # The built Info.plist as an input, so the script runs after Xcode
        # writes that file. Without it an incremental build could write the
        # plist again afterwards, and the Dev build then read as Release.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          plutil -replace DontBurnVariant -string "$APP_VARIANT" "$plist"
          if [ "$APP_VARIANT" = Dev ] && commit=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null); then
            plutil -replace DontBurnCommit -string "$commit" "$plist"
          else
            # Never leave a hash from an earlier build behind.
            plutil -remove DontBurnCommit "$plist" 2>/dev/null || true
          fi

  dontburn-hook:
    type: tool
    platform: macOS
    sources:
      - Tools/dontburn-hook
    dependencies:
      - package: DontBurnCore
    settings:
      base:
        PRODUCT_NAME: dontburn-hook
        PRODUCT_BUNDLE_IDENTIFIER: $(DONTBURN_RELEASE_BUNDLE_IDENTIFIER).hook
        # An Info.plist inside the binary carries MARKETING_VERSION, so the
        # tool reads its version from Bundle.main like the app does. The file
        # adds the app's two bundle identifiers, so the tool finds each
        # build's channel.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Tools/dontburn-hook/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES

schemes:
  DontBurn:
    build:
      targets:
        DontBurn: all
        dontburn-hook: all
    run:
      config: Debug
